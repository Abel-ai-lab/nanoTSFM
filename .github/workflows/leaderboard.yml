name: Leaderboard
on:
  push:
    branches: [main]
    paths: ["docs/leaderboard.csv", "scripts/leaderboard.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    steps:
      # Use the App token to push to protected main when configured.
      - uses: actions/create-github-app-token@v3
        id: app
        if: vars.LEADERBOARD_CLIENT_ID != ''
        with:
          client-id: ${{ vars.LEADERBOARD_CLIENT_ID }}
          private-key: ${{ secrets.LEADERBOARD_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with matplotlib python scripts/leaderboard.py docs/leaderboard.png
      - name: Commit the figure if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/leaderboard.png
          git diff --cached --quiet || { git commit -m "Update the leaderboard figure" && git push; }
